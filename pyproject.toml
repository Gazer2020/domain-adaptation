[project]
name = "domain-adaptation"
version = "0.1.0"
description = "Hydra-driven research codebase for domain adaptation experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu>=1.13.2",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.2",
    "lmdb>=1.7.5",
    "matplotlib>=3.10.8",
    "omegaconf>=2.3.0",
    "pillow-simd>=9.5.0.post2; platform_system == 'Linux' and (platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "pillow>=12.0.0; not (platform_system == 'Linux' and (platform_machine == 'x86_64' or platform_machine == 'AMD64'))",
    "scikit-learn>=1.7.2",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]
