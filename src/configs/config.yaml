defaults:
  - _self_
  - dataset: office-31
  - method: ros
  # Enable colorlog for colored console output
  - override hydra/job_logging: colorlog

# Global parameters
batch_size: 64
num_workers: 8
device: auto  # auto, cuda, mps, cpu
seed: 42
exp_name: "perf_shared"

# Performance defaults (P0)
performance:
  deterministic: false
  benchmark: true
  allow_tf32: true
  matmul_precision: high  # highest, high, medium
  pin_memory: auto
  channels_last: false  # validated default: safer than current per-batch channels_last conversion path
  non_blocking_transfer: true
  cuda_batch_prefetch: auto  # auto/true/false; overlap H2D copies with compute on CUDA
  faiss_threads: 1  # shared CPU thread limit for FAISS-based methods
  zero_grad_set_to_none: true
  amp:
    enabled: auto  # auto, true, false
    dtype: bf16    # bf16, fp16
  compile:
    enabled: false   # auto, true, false
    backend: inductor
    mode: default    # default, reduce-overhead, max-autotune, max-autotune-no-cudagraphs
    dynamic: auto    # let PyTorch specialize first and generalize after recompilation
    fullgraph: false
  augmentation:
    target_tensor_v2: auto  # auto enables the faster tensor path for supported CUDA+dcpr runs
  dataloader:
    storage_backend: files  # files, lmdb
    lmdb_root: data/lmdb-cache  # default cache dir (recommended symlink -> /root/autodl-tmp/lmdb-cache)
    persistent_workers: true
    prefetch_factor: 4
    num_workers_source: 4
    num_workers_target: 4
    num_workers_test: 2
    limit_worker_threads: true
    worker_threads: 1

resume:
  path: null  # full training-state checkpoint to resume from
  save_path: auto  # auto -> checkpoints/<exp_name>.resume.pth
  save_every_epochs: 0  # 0 disables periodic training-state checkpoints

distributed:
  enabled: auto  # auto enables under torchrun when WORLD_SIZE > 1
  backend: auto  # auto -> nccl on CUDA, otherwise gloo
  timeout_seconds: 1800
  gradient_bucket_mb: 25

hydra:
  run:
    dir: ${src_dir:}/../results/${exp_name}

  job:
    chdir: True
