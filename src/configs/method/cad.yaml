name: cad
lr: 0.01
# CAD-specific parameters
setting: osda
supported_settings: [osda]
# Backbone is usually defined in base, but can be here too
backbone: resnet50

# Training stages
pretrain_epochs: 10
adapt_epochs: 15

# Hyperparameters
semantic_hidden_dim: 512
gating_hidden_dim: null
lambda_structure: 1.0
lambda_anomaly: 0.1
unknown_threshold: 0.7

# Prototype-based rejection
prototype_similarity_threshold: 0.7
