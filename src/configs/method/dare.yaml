name: dare

lr: 0.01
epochs: 40
ramp_denom: 12.0
backbone: resnet50

bottleneck_dim: 256
relation_hidden_dim: 256
relation_temperature: 0.10
film_scale: 0.5
prototype_momentum: 0.9
refresh_source_prototypes_each_epoch: true
enable_relation_forward: true
enable_source_relation_loss: true
enable_ema_pseudo: true
enable_proto_loss: true

lambda_pseudo: 0.06
lambda_source_relation: 0.25
lambda_proto_align: 0.05
relation_label_smoothing: 0.10
enable_confidence_weighting: true
pseudo_conf_power: 2.0
pseudo_start_epoch: 8

T_sem: 0.8
ema_decay_start: 0.996
ema_decay_end: 0.9995

grad_clip: 5.0
label_smoothing: 0.05
save_ckpt_after_epoch: 5
epoch_steps_mode: max

strong_aug: true
stratified_batch: true
strong_train_aug: true

source_aug:
  brightness: 0.4
  contrast: 0.4
  saturation: 0.4
  hue: 0.1
  random_grayscale_p: 0.1
  random_erasing_p: 0.25

target_aug:
  randaugment_num_ops: 2
  randaugment_magnitude: 10

setting: msda
supported_settings: [msda]
