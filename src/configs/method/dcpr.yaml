name: dcpr

setting: msda
supported_settings: [msda]

backbone: resnet50
epochs: 20
lr: 0.01

temperature_start: 0.15
temperature_end: 0.10
prototype_granularity: domain_class
routing_mode: softmax
routing_scope: class
ambiguity_source: domain_class
ambiguity_reciprocal: harmonic
support_consistency_target: node_mass
ambiguity_consistency: true
consistency_start_epoch: 5
ramp_denom: 16.0
save_ckpt_after_epoch: 15

strong_aug: true
strong_train_aug: true
stratified_batch: true

# Source-eval batch size used only when refreshing source prototypes
# and source classifier-confusion statistics.
prototype_batch_size: 256
prototype_prefetch_factor: 4
prototype_persistent_workers: true
prototype_cuda_prefetch: auto
