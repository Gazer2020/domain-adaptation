# @package method
name: gad
setting: osda  # Open Set Domain Adaptation

# Architecture
backbone: resnet50
gating_hidden_dim: 512
semantic_hidden_dim: 512

# Training - extended for better convergence
pretrain_epochs: 10
adapt_epochs: 40
lr: 1e-3  # Standard SGD learning rate

# Gate Temperature Scheduling  
init_temperature: 10.0   # Start soft like TOD
final_temperature: 1.0   # End sharper

# Loss Weights - tuned for better H-score
lambda_align: 0.5       # MMD alignment
lambda_gate: 0.1        # Gate regularization
lambda_pseudo: 1.0      # Pseudo-label weight

# Hyperparameters
pseudo_threshold: 0.9   # High confidence for pseudo-labels
