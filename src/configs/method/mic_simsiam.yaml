# @package method
name: mic_simsiam
setting: osda  # Open Set Domain Adaptation

# Backbone
backbone: resnet50
se_reduction: 16  # SE-block reduction ratio

# Masking Parameters
mask_ratio_min: 0.25  # Minimum masking ratio (soft masking)
mask_ratio_max: 0.40  # Maximum masking ratio  
patch_size: 32        # Size of each masked patch

# SimSiam Architecture
proj_hidden_dim: 2048  # Projector hidden dimension
proj_out_dim: 2048     # Projector output dimension
pred_hidden_dim: 512   # Predictor hidden dimension

# Training Phases
warmup_epochs: 10   # Source-only warmup
adapt_epochs: 40    # MIC adaptation
# Total: 50 epochs

# Learning Rates
lr_backbone: 1e-4   # Lower for pretrained SE-ResNet
lr_head: 1e-3       # Higher for new heads

# Loss Weights
lambda_mic: 1.0     # MIC consistency loss
lambda_cls: 1.0     # Classification loss

# ============== PCOSL: Prototype-Contrastive Open-Set Learning ==============

# Contrastive Margin Loss (pull known, push unknown)
lambda_contrastive: 0.1   # Weight for contrastive margin loss
contrastive_margin: 0.5   # Margin for triplet-style loss

# Unknown Rejection (PCOSL)
unknown_ratio: 0.35       # Expected ratio of unknown samples (for percentile threshold)

# SE Channel Sparsity (鼓励稀疏通道，未知类特征更稀疏)
lambda_sparsity: 0.005     # Reduced from 0.01

# Legacy (for backward compatibility)
lambda_dual_entropy: 0.0  # Disabled - replaced by PCOSL
consistency_temperature: 2.0
label_smoothing: 0.1
entropy_threshold: 0.5    # Legacy fallback

# Unknown Rejection settings
unknown_threshold: 0.5


