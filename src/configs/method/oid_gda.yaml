# @package method
name: oid_gda
setting: csda  # Closed Set Domain Adaptation

# Architecture
backbone: resnet50
gating_hidden_dim: 256
semantic_hidden_dim: 256
discriminator_hidden_dim: 1024

# Training
pretrain_epochs: 10
adapt_epochs: 20
lr: 1e-3

# Loss Weights
lambda_adv_inv: 1.0   # Constraint A (Invariant decoupling)
lambda_sup_sp: 1.0    # Constraint B (Specific supervision)
lambda_consist: 1.0   # GATE Consistency
lambda_ent: 0.1       # Entropy


