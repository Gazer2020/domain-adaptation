name: rgr

lr: 0.01
epochs: 40
ramp_denom: 12.0
backbone: resnet50

bottleneck_dim: 256
relation_hidden_dim: 256
generator_hidden_dim: 512
relation_temperature: 0.10
boundary_temperature: 0.15
generator_dropout: 0.2
refresh_source_prototypes_each_epoch: true

lambda_source_relation: 0.20
lambda_relation_consistency: 0.40
lambda_local_consistency: 0.15
lambda_explain_consistency: 0.10
relation_label_smoothing: 0.10

consistency_conf_power: 2.0
consistency_start_epoch: 4
local_knn: 5

ema_decay_start: 0.996
ema_decay_end: 0.9995

grad_clip: 5.0
label_smoothing: 0.05
save_ckpt_after_epoch: 5
epoch_steps_mode: max

strong_aug: true
stratified_batch: true
strong_train_aug: true

source_aug:
  brightness: 0.4
  contrast: 0.4
  saturation: 0.4
  hue: 0.1
  random_grayscale_p: 0.1
  random_erasing_p: 0.25

target_aug:
  randaugment_num_ops: 2
  randaugment_magnitude: 10

clipart_focus:
  enabled: false
  apply_on_train: true
  apply_on_eval: true
  train_prob: 0.8
  white_threshold: 245
  bbox_padding: 2
  min_foreground_pixels: 10

setting: msda
supported_settings: [msda]
