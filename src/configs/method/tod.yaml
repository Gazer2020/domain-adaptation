# @package method
name: tod
setting: osda  # Optimized for Open Set Domain Adaptation

# Architecture
backbone: resnet50
gating_hidden_dim: 512
semantic_hidden_dim: 512

# Training
pretrain_epochs: 10   # Warmup with high temperature
adapt_epochs: 20      # Adaptation with temperature decay
lr: 1e-3

# Gate Temperature Scheduling
init_temperature: 10.0   # High temp → soft gates
final_temperature: 1.0   # Low temp → hard gates

# Simplified Loss Weights (3-loss architecture)
lambda_align: 0.5     # MMD domain alignment
lambda_gate: 0.1      # Unified gate regularization (sparsity + consistency)
lambda_pseudo: 1.0    # Pseudo-label weight

# Hyperparameters
pseudo_threshold: 0.9   # Confidence threshold for pseudo-labeling
