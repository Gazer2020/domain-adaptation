# @package method
name: tod
setting: osda  # Optimized for Open Set Domain Adaptation

# Architecture
backbone: resnet50
gating_hidden_dim: 256
semantic_hidden_dim: 256

# Training
pretrain_epochs: 10   # Stage 1: Source Warmup (high temperature)
adapt_epochs: 20      # Stage 2: Adaptation (temperature decreasing)
lr: 1e-3

# Gate Temperature Scheduling
init_temperature: 10.0   # High temp → gates ≈ 1 → f_inv ≈ f
final_temperature: 1.0   # Normal sigmoid

# Loss Weights
lambda_struct: 0.1    # Structure consistency (gate patterns per class)
lambda_sparse: 0.01   # Gate sparsity (encourage binary gates)
lambda_orth: 0.1      # Orthogonality (f_inv ⊥ f_sp)
lambda_mmd: 0.5       # Domain alignment via MMD
lambda_pseudo: 1.0    # Pseudo-label weight

# Hyperparameters
pseudo_threshold: 0.9   # Confidence threshold for pseudo-labeling
rejection_quantile: 0.95  # Fallback for quantile-based threshold
